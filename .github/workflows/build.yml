name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore NuGet packages
        run: |
          dotnet restore --runtime win-x64 ShareX\ShareX.csproj
          dotnet restore --runtime win-x64 ShareX.Setup\ShareX.Setup.csproj

      - name: Build
        run: |
          dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 ShareX\ShareX.csproj
          dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 ShareX.Setup\ShareX.Setup.csproj

      - name: Setup
        run: '& "ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe" -silent -job Release -platform x64'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShareX-x64
          path: |
            Output/*-setup-x64.exe
            Output/*-portable-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ShareX ${{ github.ref_name }}
          body_path: CHANGES.md
          files: |
            Output/*-setup-x64.exe
            Output/*-portable-x64.zip
