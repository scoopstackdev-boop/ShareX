name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: v20.2.0-mod.2

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore NuGet packages
        run: dotnet restore --runtime win-x64 ShareX.sln | Tee-Object -FilePath build.log -Append

      - name: Build
        run: |
          dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 ShareX\ShareX.csproj | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet build --no-restore --configuration Release -p:Platform=x64 --self-contained true /m:1 ShareX.Setup\ShareX.Setup.csproj | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Setup
        run: |
          $ErrorActionPreference = 'Continue'
          & "ShareX.Setup\bin\Release\win-x64\ShareX.Setup.exe" -silent -job Release -platform x64 2>&1 | Tee-Object -FilePath build.log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ShareX-x64
          path: |
            Output/*-setup-x64.exe
            Output/*-portable-x64.zip

      - name: Release
        if: contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ShareX ${{ env.RELEASE_TAG }}
          body_path: CHANGES.md
          files: |
            Output/*-setup-x64.exe
            Output/*-portable-x64.zip

      - name: Publish build log
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          Copy-Item build.log $env:RUNNER_TEMP\build.log -ErrorAction SilentlyContinue
          git checkout --orphan build-log
          git rm -rf --quiet .
          Copy-Item $env:RUNNER_TEMP\build.log build.log -ErrorAction SilentlyContinue
          git add build.log
          git commit -m "Build log for ${{ github.sha }}"
          git push -f origin build-log
